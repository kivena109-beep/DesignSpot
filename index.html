<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">العروض الحصرية والتصاميم المميزة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body { 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* شريط اختيار اللغة */
        .language-switcher {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        [dir="ltr"] .language-switcher {
            left: auto;
            right: 20px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #ff9900;
            color: #111;
            font-weight: bold;
            border-color: #ff9900;
        }

        /* بطاقة العرض الرئيسية */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.8s ease-in-out;
        }

        .badge {
            display: inline-block;
            background: #ff4757;
            color: #fff;
            padding: 5px 15px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 50px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .card p {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* مؤشر النقاط لتوضيح العناصر الثلاثة */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #ff9900;
            width: 28px;
            border-radius: 10px;
        }

        /* زر التفاعل الرئيسي */
        .action-button {
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(45deg, #ff9900, #ffb700);
            color: #111;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-button:hover {
            background: linear-gradient(45deg, #ffb700, #ff9900);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.6);
        }

        .action-button:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(255, 153, 0, 0.3);
        }

        [dir="rtl"] .action-button svg {
            transform: rotate(180deg);
        }

        .counter {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #aaa;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- أزرار تبديل اللغة -->
    <div class="language-switcher">
        <button class="lang-btn active" id="btnAr" onclick="setLanguage('ar')">العربية</button>
        <button class="lang-btn" id="btnEn" onclick="setLanguage('en')">English</button>
    </div>

    <!-- البطاقة الرئيسية -->
    <div class="card">
        <span class="badge" id="badgeText">عروض لفترة محدودة</span>
        <h1 id="headingText">اكتشف أحدث التصاميم</h1>
        <p id="descText">اضغط على الزر بالأسفل للاطلاع على التصميم الحالي والانتقال للتالي.</p>

        <!-- مؤشر النقاط -->
        <div class="dots-container">
            <div class="dot active" id="dot0"></div>
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
        </div>

        <button class="action-button" id="mainBtn">
            <span id="btnText">فتح التصميم والتالي</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>

        <div class="counter" id="statusText">التصميم 1 من 3</div>
    </div>

    <script>
        const myPinterestAds = [
            "https://pin.it/4xbY20lzh",
            "https://pin.it/72xpNqHsi",
            "https://pin.it/3UP33Fuis"
        ];

        let currentAdIndex = 0;
        let currentLang = 'ar';

        const translations = {
            ar: {
                title: "العروض الحصرية والتصاميم المميزة",
                badge: "عروض لفترة محدودة",
                heading: "اكتشف أحدث التصاميم",
                desc: "اضغط على الزر للاطلاع على التصميم في نافذة جديدة والانتقال للتالي.",
                btnNext: "فتح التصميم والتالي",
                btnFinish: "تمت مشاهدة الكل",
                counter: (curr, total) => `التصميم ${curr} من ${total}`,
                completed: "تم عرض جميع التصاميم بنجاح"
            },
            en: {
                title: "Exclusive Offers & Designs",
                badge: "Limited Time Offers",
                heading: "Discover Latest Designs",
                desc: "Click the button to open the design in a new tab and move to the next.",
                btnNext: "Open Design & Next",
                btnFinish: "All Viewed",
                counter: (curr, total) => `Design ${curr} of ${total}`,
                completed: "All designs viewed successfully"
            }
        };

        const mainBtn = document.getElementById('mainBtn');
        const statusText = document.getElementById('statusText');

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('badgeText').textContent = t.badge;
            document.getElementById('headingText').textContent = t.heading;
            document.getElementById('descText').textContent = t.desc;
            
            if (currentAdIndex < myPinterestAds.length) {
                document.getElementById('btnText').textContent = t.btnNext;
            } else {
                document.getElementById('btnText').textContent = t.btnFinish;
            }

            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');

            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            
            // تحديث النقاط (Dots)
            for (let i = 0; i < myPinterestAds.length; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i === currentAdIndex) {
                    dot.className = 'dot active';
                } else {
                    dot.className = 'dot';
                }
            }

            // تحديث النص والعداد
            if (currentAdIndex < myPinterestAds.length) {
                statusText.textContent = t.counter(currentAdIndex + 1, myPinterestAds.length);
                document.getElementById('btnText').textContent = t.btnNext;
            } else {
                statusText.textContent = t.completed;
                document.getElementById('btnText').textContent = t.btnFinish;
                mainBtn.style.opacity = "0.6";
                mainBtn.style.cursor = "default";
            }
        }

        mainBtn.addEventListener('click', function() {
            if (currentAdIndex < myPinterestAds.length) {
                window.open(myPinterestAds[currentAdIndex], '_blank');
                currentAdIndex++;
                updateUI();
            }
        });
    </script>

</body>
</html>
