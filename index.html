<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">معرض التصاميم المباشرة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body { 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            padding: 20px;
            position: relative;
        }

        /* شريط اختيار اللغة */
        .language-switcher {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        [dir="ltr"] .language-switcher {
            left: auto;
            right: 20px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #ff9900;
            color: #111;
            font-weight: bold;
            border-color: #ff9900;
        }

        /* بطاقة العرض الرئيسية */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }

        .badge {
            display: inline-block;
            background: #ff4757;
            color: #fff;
            padding: 5px 15px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 50px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .card p {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* معاينة الصورة القابلة للنقر */
        .image-container {
            position: relative;
            width: 100%;
            height: 240px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            cursor: pointer;
            border: 2px solid rgba(255, 153, 0, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .image-container:hover {
            transform: scale(1.02);
            border-color: #ff9900;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .image-container:hover .image-overlay {
            opacity: 1;
        }

        /* مؤشر النقاط */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #ff9900;
            width: 25px;
            border-radius: 10px;
        }

        /* زر التفاعل */
        .action-button {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(45deg, #ff9900, #ffb700);
            color: #111;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-button:hover {
            background: linear-gradient(45deg, #ffb700, #ff9900);
            transform: translateY(-2px);
        }

        [dir="rtl"] .action-button svg {
            transform: rotate(180deg);
        }

        .counter {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #aaa;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- أزرار تبديل اللغة -->
    <div class="language-switcher">
        <button class="lang-btn active" id="btnAr" onclick="setLanguage('ar')">العربية</button>
        <button class="lang-btn" id="btnEn" onclick="setLanguage('en')">English</button>
    </div>

    <!-- البطاقة الرئيسية -->
    <div class="card">
        <span class="badge" id="badgeText">عرض الصور المباشرة</span>
        <h1 id="headingText">استعراض التصاميم</h1>
        <p id="descText">اضغط على الزر أو الصورة لفتح الصفحة والتنقل للتالية.</p>

        <!-- الصورة القابلة للنقر -->
        <div class="image-container" id="imageBox">
            <img src="https://via.placeholder.com/500x300/203a43/ffffff?text=Design+Preview" id="designImg" alt="Design Preview">
            <div class="image-overlay" id="overlayText">فتح الصورة المباشرة 🖼️</div>
        </div>

        <!-- مؤشر النقاط -->
        <div class="dots-container">
            <div class="dot active" id="dot0"></div>
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
        </div>

        <button class="action-button" id="mainBtn">
            <span id="btnText">فتح الصورة والتالي</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>

        <div class="counter" id="statusText">الصورة 1 من 3</div>
    </div>

    <script>
        // روابط Pinterest المباشرة التي أرفقتها
        const directImageLinks = [
            "https://www.pinterest.com/pin/1127799931722268616/feedback/?invite_code=f8b42eea2dad42cfbc7b44c7e633472a&sender_id=1127800069093914891",
            "https://www.pinterest.com/pin/1127799931722268862/feedback/?invite_code=0f9d17b010a34397bb08eb85ec7cad91&sender_id=1127800069093914891",
            "https://www.pinterest.com/pin/112779993172270007/feedback/?invite_code=9b8b4c1818ab44f0a36d4650a8a24ae1&sender_id=1127800069093914891"
        ];

        let currentAdIndex = 0;
        let currentLang = 'ar';

        const translations = {
            ar: {
                title: "معرض التصاميم المباشرة",
                badge: "عرض الصور المباشرة",
                heading: "استعراض التصاميم",
                desc: "اضغط على الزر أو الصورة لفتح الصفحات بالتتابع.",
                overlay: "فتح الصورة المباشرة 🖼️",
                btnNext: "فتح الصورة والتالي",
                btnFinish: "تمت مشاهدة جميع الصور",
                counter: (curr, total) => `الصورة ${curr} من ${total}`,
                completed: "تم استعراض كل الصور"
            },
            en: {
                title: "Direct Image Gallery",
                badge: "Direct View",
                heading: "Browse Designs",
                desc: "Click the image or button to open the pages in sequence.",
                overlay: "Open Image 🖼️",
                btnNext: "Open Image & Next",
                btnFinish: "All Images Viewed",
                counter: (curr, total) => `Image ${curr} of ${total}`,
                completed: "All images browsed"
            }
        };

        const mainBtn = document.getElementById('mainBtn');
        const imageBox = document.getElementById('imageBox');
        const statusText = document.getElementById('statusText');

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('badgeText').textContent = t.badge;
            document.getElementById('headingText').textContent = t.heading;
            document.getElementById('descText').textContent = t.desc;
            document.getElementById('overlayText').textContent = t.overlay;

            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');

            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            
            if (currentAdIndex < directImageLinks.length) {
                for (let i = 0; i < directImageLinks.length; i++) {
                    document.getElementById(`dot${i}`).className = (i === currentAdIndex) ? 'dot active' : 'dot';
                }

                statusText.textContent = t.counter(currentAdIndex + 1, directImageLinks.length);
                document.getElementById('btnText').textContent = t.btnNext;
            } else {
                statusText.textContent = t.completed;
                document.getElementById('btnText').textContent = t.btnFinish;
                mainBtn.style.opacity = "0.6";
                mainBtn.style.cursor = "default";
                imageBox.style.cursor = "default";
            }
        }

        function handleNextAction() {
            if (currentAdIndex < directImageLinks.length) {
                window.open(directImageLinks[currentAdIndex], '_blank');
                currentAdIndex++;
                updateUI();
            }
        }

        mainBtn.addEventListener('click', handleNextAction);
        imageBox.addEventListener('click', handleNextAction);

        setLanguage('ar');
    </script>

</body>
</html>
